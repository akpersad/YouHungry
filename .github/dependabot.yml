version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One weekly PR for all minor/patch bumps; majors get individual PRs.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Playwright is intentionally pinned; bump it deliberately alongside
      # the browser images used in CI.
      - dependency-name: '@playwright/test'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
