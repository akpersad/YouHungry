version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One weekly PR for all minor/patch bumps; majors get individual PRs.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Playwright is intentionally pinned; bump it deliberately alongside
      # the browser images used in CI.
      - dependency-name: '@playwright/test'
      # eslint 10 broke eslint-plugin-react when we were on
      # eslint-config-next 15. Now on config-next 16 (peer eslint >=9.0.0)
      # eslint 10 may work — test deliberately before unignoring.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
