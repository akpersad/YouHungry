name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly comprehensive test run at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # Smoke lane - fastest signal, intended as a required PR check
  smoke-tests:
    name: E2E Smoke
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # The v2 specs need the fixture places/squad in the e2e database.
      # The script REFUSES the production DB name and live Clerk keys, so a
      # misconfigured MONGODB_DATABASE secret fails loudly here instead of
      # timing out cryptically in the specs.
      - name: Seed v2 e2e data (idempotent; refuses production)
        run: npm run seed:v2-dev
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key (guest cookies + fork tokens). A literal test
          # value on purpose: it only signs tokens on the throwaway in-runner
          # server, and a missing GitHub secret would 500 every fork page.
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret

      - name: Run smoke tests (@smoke)
        run: npm run test:e2e:smoke
        env:
          CI: true
          # Test user credentials
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_USERNAME: ${{ secrets.E2E_TEST_USER_USERNAME }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          # Database
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          # Authentication (Clerk)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          # Google APIs
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
          # App Configuration
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # PR Tests - Fast feedback (Chromium + Mobile Chrome only)
  pr-tests:
    name: PR Tests (Chromium + Mobile Chrome)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Run on PRs and pushes to main/develop
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Seed v2 e2e data (idempotent; refuses production)
        run: npm run seed:v2-dev
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret

      - name: Run E2E tests (Chromium + Mobile Chrome)
        run: npm run test:e2e
        env:
          CI: true
          # This will run chromium-fast, chromium-slow, and mobile-chrome-fast
          # RUN_ALL_BROWSERS is NOT set, so other browsers are skipped
          # Test user credentials
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_USERNAME: ${{ secrets.E2E_TEST_USER_USERNAME }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          # Database
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          # Authentication (Clerk)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          # Google APIs
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
          # App Configuration
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Nightly Comprehensive Tests - All 5 browsers
  nightly-comprehensive:
    name: Nightly Tests (All Browsers)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    # Only run on schedule (nightly)
    if: github.event_name == 'schedule'

    strategy:
      fail-fast: false
      matrix:
        # Shard across multiple runners for speed
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ALL Playwright Browsers
        run: npx playwright install --with-deps

      - name: Seed v2 e2e data (idempotent; refuses production)
        run: npm run seed:v2-dev
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret

      - name: Run comprehensive E2E tests (All 5 browsers)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: true
          RUN_ALL_BROWSERS: true
          # This enables all 5 browsers: chromium, mobile chrome, mobile safari, firefox, webkit
          # Test user credentials
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_USERNAME: ${{ secrets.E2E_TEST_USER_USERNAME }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          # Database
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          # Authentication (Clerk)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          # Google APIs
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
          # App Configuration
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # Accessibility Tests - Run on every PR (fast and critical)
  accessibility-tests:
    name: Accessibility Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:accessibility
        env:
          CI: true
          # Test user credentials
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_USERNAME: ${{ secrets.E2E_TEST_USER_USERNAME }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          # Database
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          # Authentication (Clerk)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          # Google APIs
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
          # App Configuration
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 30

  # Lighthouse Performance - Run on PRs and main branch
  lighthouse:
    name: Lighthouse Performance
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          CI: true
          # Database
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          # Authentication (Clerk)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          # Google APIs
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
          # App Configuration
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run Lighthouse CI
        run: npm run lighthouse
        env:
          CI: true
          # Test user credentials
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_USERNAME: ${{ secrets.E2E_TEST_USER_USERNAME }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          # Database
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          # Authentication (Clerk)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          # Google APIs
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
          # App Configuration
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 30
