name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly full run at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # Smoke lane - fastest signal, intended as a required PR check
  smoke-tests:
    name: E2E Smoke
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # The specs need the fixture places/squad in the e2e database.
      # The script REFUSES the production DB name and live Clerk keys, so a
      # misconfigured MONGODB_DATABASE secret fails loudly here instead of
      # timing out cryptically in the specs.
      - name: Seed e2e data (idempotent; refuses production)
        run: npm run seed:v2-dev
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key (guest cookies + fork tokens). A literal test
          # value on purpose: it only signs tokens on the throwaway in-runner
          # server, and a missing GitHub secret would 500 every fork page.
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret

      - name: Run smoke tests (@smoke)
        run: npm run test:e2e:smoke
        env:
          CI: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # PR Tests - the full journey suite (Chromium + Mobile Chrome smoke cuts)
  pr-tests:
    name: PR Tests (Chromium + Mobile Chrome)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Seed e2e data (idempotent; refuses production)
        run: npm run seed:v2-dev
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Nightly - same suite, fresh runner, catches drift the PR lanes miss
  nightly:
    name: Nightly Tests
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Seed e2e data (idempotent; refuses production)
        run: npm run seed:v2-dev
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # Accessibility - every axe scan (gallery + lanes, both color modes)
  accessibility-tests:
    name: Accessibility Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Seed e2e data (idempotent; refuses production)
        run: npm run seed:v2-dev
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret

      - name: Run accessibility tests
        run: npm run test:accessibility
        env:
          CI: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 30

  # Lighthouse Performance - Run on PRs and main branch
  lighthouse:
    name: Lighthouse Performance
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          CI: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run Lighthouse CI
        run: npm run lighthouse
        env:
          CI: true
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # v2 signing key: literal test value on purpose (in-runner server only)
          V2_TOKEN_SECRET: fitr-e2e-token-signing-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 30
